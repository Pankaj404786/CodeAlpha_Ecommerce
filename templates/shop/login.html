{% extends 'base.html' %}
{% block title %}Login | ShopEase{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Sign in to continue shopping.</p><form method="post" class="site-form">{% csrf_token %}{{ form.as_p }}<button class="primary-button full-button" type="submit">Log in →</button></form><p class="auth-foot">New here? <a href="{% url 'register' %}">Create an account</a></p></div></div>
{% endblock %}
