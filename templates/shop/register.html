{% extends 'base.html' %}
{% block title %}Create account | ShopEase{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card"><p class="eyebrow">JOIN SHOEASE</p><h1>Create account</h1><p class="muted">Sign up to place orders and track your purchases.</p><form method="post" class="site-form">{% csrf_token %}{{ form.as_p }}<button class="primary-button full-button" type="submit">Create account →</button></form><p class="auth-foot">Already have an account? <a href="{% url 'login' %}">Log in</a></p></div></div>
{% endblock %}
